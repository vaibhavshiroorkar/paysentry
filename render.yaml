# Free-tier demo. See docs/hosting.md before applying this Blueprint.
services:
  - type: web
    name: paysentry-demo
    runtime: docker
    plan: free
    # Embedded mock gateways keep their state in process memory.
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_EMBEDDED_GATEWAYS
        value: "true"
      - key: ADMIN_API_KEY
        generateValue: true
      # A free Neon database, set in the dashboard. Render's free Postgres expires after 30 days.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paysentry-kv
          property: connectionString
      # The free database allows few connections.
      - key: DB_POOL_SIZE
        value: "5"
      # Render's edge sets this to the visitor's address and overwrites any
      # value the client sent. X-Forwarded-For ends in internal proxy addresses.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP

  - type: keyvalue
    name: paysentry-kv
    plan: free
    # An empty list allows only private connections from this workspace.
    ipAllowList: []
