[project]
name = "paysentry"
version = "0.1.0"
description = "Card payments for merchants on a double-entry ledger that stays correct under retries and races"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
