name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paysentry
          POSTGRES_PASSWORD: paysentry
          POSTGRES_DB: paysentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paysentry"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check app gateway tests scripts
      - run: node --check app/static/demo.js
      - run: uv run pytest -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Render builds this same Dockerfile; a broken build should fail here first.
      - run: docker build -t paysentry:ci .
