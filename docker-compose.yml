services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paysentry
      POSTGRES_PASSWORD: paysentry
      POSTGRES_DB: paysentry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysentry"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://paysentry:paysentry@db:5432/paysentry
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      GATEWAYS: >-
        {"alpha": {"flavour": "alpha", "url": "http://gateway-alpha:9000"},
         "beta": {"flavour": "beta", "url": "http://gateway-beta:9000"}}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway-alpha:
        condition: service_started
      gateway-beta:
        condition: service_started

  # Mock card gateways. POST /_control on either one sets its latency,
  # outage and timeout behaviour. See docs/design/gateways.md.
  gateway-alpha:
    build: .
    command: ["/app/.venv/bin/uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      GATEWAY_FLAVOUR: alpha
    ports:
      - "9001:9000"

  gateway-beta:
    build: .
    command: ["/app/.venv/bin/uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      GATEWAY_FLAVOUR: beta
    ports:
      - "9002:9000"
